name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Generate Prisma client and validate schema
        run: |
          npm run db:generate
          npm run db:validate

      - name: Typecheck
        run: npm run typecheck

      - name: UI design tokens check
        run: npm run test:ui:tokens

      - name: CLI and security offline tests
        run: npm run test:cli

      - name: Offline delivery preflight
        run: npm run delivery:check

      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
